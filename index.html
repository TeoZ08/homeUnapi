<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal UnAPI - Oficinas de Informática</title>
    <link rel="icon" href="img/favicon-unapi.webp?v=2" type="image/webp" />
    <link rel="preload" href="img/home/hero-unapi.webp?v=20260801-2" as="image" type="image/webp" fetchpriority="high" media="(min-width: 681px)" />
    <link rel="preload" href="img/home/hero-unapi-mobile-codex.webp?v=20260801-2" as="image" type="image/webp" fetchpriority="high" media="(max-width: 680px)" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/home.css?v=20260801-7" />
  </head>
  <body class="home-page portal-page">
    <main class="page-shell">
      <header class="topbar home-masthead" aria-label="Cabeçalho do portal">
        <div class="brand brand-with-mark">
          <img class="brand-mark" src="img/unapi-marca.webp" alt="UnAPI UFMS" width="1024" height="1024" />
          <div class="brand-copy">
            <strong>Oficinas de Informática</strong>
          </div>
        </div>
      </header>

      <section class="hero home-choice" aria-labelledby="home-title">
        <div class="hero-content">
          <h1 id="home-title">
            <span class="welcome-line">Seja bem-vindo(a)!</span>
            <span class="choice-line">Escolha uma opção:</span>
          </h1>

          <nav class="home-options" aria-label="Acessos do portal">
            <a class="home-option option-tools" href="ferramentas/">
              <span class="option-symbol option-keyboard" aria-hidden="true"><i>A</i><i>B</i><i>C</i></span>
              <span class="option-copy"><small>Quero praticar</small><strong>Atividades</strong></span>
              <span class="option-open">Abrir <span aria-hidden="true">→</span></span>
            </a>

            <a class="home-option option-videos" href="videos/">
              <span class="option-symbol option-play" aria-hidden="true"><i></i></span>
              <span class="option-copy"><small>Quero assistir</small><strong>Vídeos</strong></span>
              <span class="option-open">Abrir <span aria-hidden="true">→</span></span>
            </a>
          </nav>
        </div>
      </section>

      <footer class="institutional-footer" aria-label="Logos institucionais">
        <div class="logos-footer">
          <img src="img/ufms.webp" alt="UFMS" />
          <img class="logo-unapi" src="img/unapi.webp" alt="UnAPI" />
          <img class="logo-gov" src="img/gov-federal.webp" alt="Governo Federal" />
          <img src="img/facom.webp" alt="FACOM" />
          <img src="img/pet-sistemas.webp" alt="PET Sistemas" />
          <img class="logo-pet-computacao" src="img/pet-computacao.webp" alt="PET Computação" />
        </div>
        <div class="footer-note">Portal das Oficinas de Informática • UNAPI UFMS</div>
      </footer>
    </main>
    <script src="js/portal-motion.js" defer></script>
  </body>
</html>
