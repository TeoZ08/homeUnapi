<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vídeos e Registros - UnAPI UFMS</title>
    <link rel="icon" href="../img/favicon-unapi.webp?v=2" type="image/webp" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/videos.css" />
  </head>
  <body class="videos-page">
    <main class="page-shell">
      <header class="topbar" aria-label="Cabeçalho do portal">
        <div class="brand brand-with-mark">
          <img class="brand-mark" src="../img/unapi-marca.webp" alt="UnAPI UFMS" width="1024" height="1024" />
          <div class="brand-copy"><small>Materiais da oficina</small><strong>Vídeos das oficinas</strong></div>
        </div>
        <nav class="topnav" aria-label="Navegação da página">
          <a class="nav-action nav-action--back" href="../">Início</a>
          <a class="nav-action nav-action--featured nav-action--activities" href="../ferramentas/">Atividades</a>
        </nav>
      </header>

      <section class="videos-direct" aria-labelledby="videos-title">
        <header class="videos-heading">
          <h1 id="videos-title">Escolha um vídeo</h1>
        </header>

        <div class="video-grid" aria-label="Vídeos das oficinas">
          <a class="video-card" href="https://youtube.com/shorts/-jH6xlBCN_o?si=tamyI9VxZL70dKnA" target="_blank" rel="noopener noreferrer">
            <span class="video-media"><img src="../img/videos/primeira-oficina.webp" alt="" width="480" height="360" decoding="async" /><span class="play-button" aria-hidden="true">▶</span></span>
            <span class="video-copy"><strong>Teclado</strong><span class="video-action">Assistir no YouTube <span aria-hidden="true">↗</span></span></span>
          </a>

          <a class="video-card" href="https://youtube.com/shorts/lQYpWqZ3yww?si=OILJJdqehTFEfZaW" target="_blank" rel="noopener noreferrer">
            <span class="video-media"><img src="../img/videos/participantes-em-atividade.webp" alt="" width="480" height="360" loading="lazy" decoding="async" /><span class="play-button" aria-hidden="true">▶</span></span>
            <span class="video-copy"><strong>Mouse</strong><span class="video-action">Assistir no YouTube <span aria-hidden="true">↗</span></span></span>
          </a>

          <a class="video-card" href="https://youtube.com/shorts/-2MqL9CBbF0?si=iCjgI73N79qkxGG" target="_blank" rel="noopener noreferrer">
            <span class="video-media"><img src="../img/videos/pratica-com-acompanhamento.webp" alt="" width="480" height="360" loading="lazy" decoding="async" /><span class="play-button" aria-hidden="true">▶</span></span>
            <span class="video-copy"><strong>Contas Gov</strong><span class="video-action">Assistir no YouTube <span aria-hidden="true">↗</span></span></span>
          </a>

          <a class="video-card" href="https://youtube.com/shorts/bZv5cydyzWo?si=2nxi_29wWPQc3dKE" target="_blank" rel="noopener noreferrer">
            <span class="video-media"><img src="../img/videos/atividades-da-oficina.webp" alt="" width="480" height="360" loading="lazy" decoding="async" /><span class="play-button" aria-hidden="true">▶</span></span>
            <span class="video-copy"><strong>Gov</strong><span class="video-action">Assistir no YouTube <span aria-hidden="true">↗</span></span></span>
          </a>
        </div>
      </section>

      <footer class="institutional-footer" aria-label="Logos institucionais">
        <div class="logos-footer">
          <img src="../img/ufms.webp" alt="UFMS" width="415" height="600" loading="lazy" decoding="async" />
          <img class="logo-unapi" src="../img/unapi.webp" alt="UnAPI" width="545" height="458" loading="lazy" decoding="async" />
          <img class="logo-gov" src="../img/gov-federal.webp" alt="Governo Federal" width="600" height="289" loading="lazy" decoding="async" />
          <img src="../img/facom.webp" alt="FACOM" width="600" height="573" loading="lazy" decoding="async" />
          <img src="../img/pet-sistemas.webp" alt="PET Sistemas" width="600" height="283" loading="lazy" decoding="async" />
          <img class="logo-pet-computacao" src="../img/pet-computacao.webp" alt="PET Computação" width="600" height="400" loading="lazy" decoding="async" />
        </div>
        <div class="footer-note">Portal das Oficinas de Informática • UNAPI UFMS</div>
      </footer>
    </main>
    <script src="../js/portal-motion.js" defer></script>
  </body>
</html>
