<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobilidade com o celular - UnAPI UFMS</title>
    <link rel="icon" href="../img/favicon-unapi.webp?v=2" type="image/webp" />
    <link rel="preload" href="../img/mobilidade/card-corrida-mascote.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="../img/mobilidade/card-rotas-mascote.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/mobilidade.css" />
  </head>
  <body class="mobility-index-page portal-page has-page-overlay">
    <main class="page-shell">
      <header class="topbar" aria-label="Cabeçalho do portal">
        <div class="brand brand-with-mark">
          <img class="brand-mark" src="../img/unapi-marca.webp" alt="UnAPI UFMS" width="1024" height="1024" />
          <div class="brand-copy"><small>Oficinas de informática</small><strong>Mobilidade</strong></div>
        </div>
        <nav class="topnav" aria-label="Navegação da página">
          <a class="nav-back" href="../ferramentas/">← Voltar para Ferramentas</a>
          <a href="../">Início</a>
        </nav>
      </header>

      <section class="mobility-direct" aria-labelledby="mobility-title">
        <header class="mobility-heading">
          <h1 id="mobility-title">Escolha uma atividade</h1>
        </header>

        <div class="mobility-journey" aria-label="Atividades de mobilidade">
        <a class="mobility-experience ride-card" href="uber/">
          <div class="mobility-card-visual" aria-hidden="true">
            <img class="mobility-card-image" src="../img/mobilidade/card-corrida-mascote.webp" width="1600" height="614" alt="" loading="eager" fetchpriority="high" decoding="sync" />
          </div>
          <div class="mobility-card-content">
            <h2>Pedir uma corrida</h2>
          </div>
          <span class="btn-visual">Abrir <span aria-hidden="true">→</span></span>
        </a>

        <a class="mobility-experience transit-card" href="maps/">
          <div class="mobility-card-visual" aria-hidden="true">
            <img class="mobility-card-image" src="../img/mobilidade/card-rotas-mascote.webp" width="1600" height="614" alt="" loading="eager" fetchpriority="high" decoding="sync" />
          </div>
          <div class="mobility-card-content">
            <h2>Planejar uma rota</h2>
          </div>
          <span class="btn-visual">Abrir <span aria-hidden="true">→</span></span>
        </a>
        </div>
      </section>

      <footer class="institutional-footer" aria-label="Logos institucionais">
        <div class="logos-footer">
          <img src="../img/ufms.webp" alt="UFMS" />
          <img class="logo-unapi" src="../img/unapi.webp" alt="UnAPI" />
          <img class="logo-gov" src="../img/gov-federal.webp" alt="Governo Federal" />
          <img src="../img/facom.webp" alt="FACOM" />
          <img src="../img/pet-sistemas.webp" alt="PET Sistemas" />
          <img class="logo-pet-computacao" src="../img/pet-computacao.webp" alt="PET Computação" />
        </div>
        <div class="footer-note">Portal das Oficinas de Informática • UNAPI UFMS</div>
      </footer>
    </main>
    <script src="../js/portal-motion.js" defer></script>
  </body>
</html>
