<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de ônibus no Maps - Mobilidade UnAPI</title>
    <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/mobilidade.css" />
    <link rel="stylesheet" href="../../css/mobilidade-maps.css" />
    <script src="../../js/mobilidade-maps.js" defer></script>
  </head>
  <body class="mobility-simulator-page maps-simulator-page has-page-overlay">
    <main class="simulator-page-shell">
      <nav class="simulator-toolbar" aria-label="Controles do simulador">
        <a class="simulator-control simulator-back" href="../"><svg class="ui-icon" aria-hidden="true"><use href="../../img/mobilidade/ui-icons.svg#m-arrow-back"></use></svg><span>Voltar para Mobilidade</span></a>
        <button id="reset-simulation" class="simulator-control" type="button"><span class="control-symbol" aria-hidden="true">↻</span><span>Reiniciar simulação</span></button>
        <button id="fullscreen-simulation" class="simulator-control" type="button" aria-pressed="false"><span class="control-symbol" aria-hidden="true">⛶</span><span data-fullscreen-label>Abrir em tela cheia</span></button>
      </nav>

      <p class="training-notice">
        <strong>Ambiente de treinamento</strong>
        <span>Não use dados reais. Nenhuma rota é iniciada e nenhum dado é enviado.</span>
      </p>

      <section id="simulator-phone" class="phone-frame" aria-label="Celular com aplicativo de mapas simulado">
        <div class="phone-screen">
          <div class="phone-status" aria-hidden="true">
            <span>09:35</span><span class="phone-sensors"></span><span class="phone-signal">▮▮▮ Wi-Fi ▰</span>
          </div>
          <div id="maps-app" class="app-viewport"></div>
          <div class="system-navigation" aria-hidden="true"></div>
        </div>
      </section>

      <p id="maps-announcement" class="sr-only" aria-live="polite"></p>
      <noscript>Ative o JavaScript para usar esta simulação educativa.</noscript>
    </main>
  </body>
</html>
